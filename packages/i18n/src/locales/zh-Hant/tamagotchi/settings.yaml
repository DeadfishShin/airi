            title: 已接受平均值
            description: 套用截止值後、飽和度加權前的平均色彩。
          target:
            title: 剩餘補光
            description: 移除明亮光源後的大範圍色彩。
          applied:
            title: 套用輸出
            description: 套用時間平滑後的色彩。
          lobe:
            title: 光源 {index}
            description: 套用時間平滑後持續存在的明亮區域。
      sampling:
        title: 螢幕取樣
        capture-interval:
          title: 擷取間隔
          description: 設定螢幕取樣之間的時間。
        response-time:
          title: 反應時間
          description: 設定取樣色彩適應螢幕變化的速度。
        sample-width:
          title: 取樣寬度
          description: 設定縮小後擷取畫面的寬度。
        sample-height:
          title: 取樣高度
          description: 設定縮小後擷取畫面的高度。
        black-cutoff:
          title: 黑色截止值
          description: 忽略最亮色彩通道小於此值的像素。
        white-cutoff:
          title: 白色截止值
          description: 忽略最暗色彩通道大於此值的像素。
        neutral-color-weight:
          title: 中性色權重
          description: 設定低飽和色彩的最低權重。
      shader:
        title: 著色器反應
        base-brightness:
          title: 基礎亮度
          description: 設定加入取樣光線前的模型亮度。
        base-contrast:
          title: 基礎對比
          description: 設定加入取樣光線前模型明暗值的區分程度。
        tint-coverage:
          title: 色調覆蓋範圍
          description: 設定柔和色調從面向螢幕中心的一側延伸多遠。
        highlight-coverage:
          title: 高光覆蓋範圍
          description: 設定面向螢幕中心的一側有多少區域接收明顯光線。
        source-balance:
          title: 光源平衡
          description: 減少大範圍環境補光，並加強偵測到的明亮區域光源。
        tint-strength:
          title: 色調強度
          description: 設定大範圍加法色調的強度。
        highlight-strength:
          title: 高光強度
          description: 設定窄範圍加法光線的強度。
    lag-visualizer:
